# Drop-in for bluez-alsa-utils' bluealsa-aplay.service: play every A2DP source
# into the PiMost card (I2S slave of the OS8104; this is the MOST source port
# mostd routes onto the synchronous channels on Allocate).
[Service]
ExecStart=
ExecStart=/usr/bin/bluealsa-aplay --profile-a2dp --pcm=hw:CARD=PiMost 00:00:00:00:00:00
Restart=always
RestartSec=2
